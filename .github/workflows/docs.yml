name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Sphinx
        run: pip install -r docs/requirements.txt

      # Builds the API, generates the reference from it (fails on undocumented public members),
      # then runs Sphinx with warnings as errors.
      - name: Build the docs
        run: ./build-docs.sh

      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
          if-no-files-found: error

  # Publishes the site to GitHub Pages from main (Pages source: GitHub Actions).
  pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docs-html
          path: html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: html
      - id: deploy
        uses: actions/deploy-pages@v4
